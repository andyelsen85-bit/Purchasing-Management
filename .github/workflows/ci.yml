name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Prepare test database
        run: pnpm --filter @workspace/db push
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: API tests
        run: pnpm --filter @workspace/api-server test
        env:
          # Most tests are isolated; the audit immutability regression test
          # exercises PostgreSQL triggers against this disposable CI database.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Frontend tests
        run: pnpm --filter @workspace/purchasing-management test

      - name: Build all packages
        run: pnpm run build

      - name: Validate the production image
        run: docker build --tag purchasing-management:ci .