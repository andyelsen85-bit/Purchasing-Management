name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: API tests
        run: pnpm --filter @workspace/api-server test
        env:
          # Unit tests import the DB package for schema/query objects but never
          # connect. CI has no provisioned database, so provide a non-secret,
          # intentionally unreachable URL to satisfy module initialization.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Frontend tests
        run: pnpm --filter @workspace/purchasing-management test

      - name: Build all packages
        run: pnpm run build

      - name: Validate the production image
        run: docker build --tag purchasing-management:ci .